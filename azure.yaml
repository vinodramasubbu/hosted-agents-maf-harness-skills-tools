# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: investiq-skills-and-tools
requiredVersions:
  extensions:
    azure.ai.agents: ">=0.1.0-preview"
services:
  ai-project:
    host: azure.ai.project
  investiq-skills-and-tools:
    project: .
    host: azure.ai.agent
    uses:
      - ai-project
    kind: hosted
    name: investiq-skills-and-tools
    description: Minimal Harness demo with local skills and Yahoo Finance and DuckDuckGo tools.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS}
      APIM_SUBSCRIPTION_KEY: $${{connections.investiq-apim.credentials.APIM_SUBSCRIPTION_KEY}}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
